<template>
  <lightning-card title="Account Onboarding">
    <lightning-button-menu slot="actions" alternative-text="Show actions" icon-name="utility:down" variant="border"
      menu-alignment="right">

      <lightning-menu-item value="new" label="New">
      </lightning-menu-item>

      <lightning-menu-item value="refresh" label="Refresh">
      </lightning-menu-item>

    </lightning-button-menu>

    <div class="slds-p-around_medium">

      <lightning-record-picker label="Prospective Account" placeholder="Search prospective accounts..."
        object-api-name="Account" filter={accountFilter} onchange={handleAccountChange}>
      </lightning-record-picker>

      <template if:true={selectedAccountId}>
        <div class="slds-m-top_medium">
          <lightning-button variant="brand" label="Onboard" icon-name="utility:add" onclick={handleOnboard}>
          </lightning-button>
        </div>
      </template>

      <template if:true={alreadyOnboarded}>
        <div class="slds-text-color_error slds-m-top_small">
          This account has already been submitted for onboarding.
          Please try again later.
        </div>
      </template>

    </div>
  </lightning-card>

  <!-- Confirmation Modal -->
  <template if:true={showConfirmation}>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading"
      class="slds-modal slds-fade-in-open">

      <div class="slds-modal__container">

        <header class="slds-modal__header">
          <h2 id="modal-heading" class="slds-text-heading_medium">
            Confirm Onboarding
          </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">

          <!-- Confirmation screen -->
          <template if:false={onboardingConfirmed}>

            <p class="slds-m-bottom_medium">
              Are you sure you want to onboard the selected account?
            </p>

            <!-- CONTACTS -->
            <div class="slds-m-bottom_large">
              <h3 class="slds-text-heading_small slds-m-bottom_small">
                Contacts
              </h3>

              <template if:true={contacts.length}>
                <div class="slds-scrollable_x">
                  <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                      <tr>
                        <th scope="col">
                          Name
                        </th>
                        <th scope="col">
                          Id
                        </th>
                      </tr>
                    </thead>

                    <tbody>
                      <template for:each={contacts} for:item="contact">
                        <tr key={contact.Id}>
                          <td>
                            {contact.Name}
                          </td>
                          <td>
                            <lightning-formatted-url value={contact.recordUrl} label={contact.Id} target="_blank">
                            </lightning-formatted-url>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template if:false={contacts.length}>
                <p class="slds-text-color_weak">
                  No contacts found.
                </p>
              </template>
            </div>


            <!-- LEADS -->
            <div>
              <h3 class="slds-text-heading_small slds-m-bottom_small">
                Leads
              </h3>

              <template if:true={leads.length}>
                <div class="slds-scrollable_x">
                  <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                      <tr>
                        <th scope="col">
                          Name
                        </th>
                        <th scope="col">
                          Id
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <template for:each={leads} for:item="lead">
                        <tr key={lead.Id}>
                          <td>
                            {lead.Name}
                          </td>
                          <td>
                            <lightning-formatted-url value={lead.recordUrl} label={lead.Id} target="_blank">
                            </lightning-formatted-url>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template if:false={leads.length}>
                <p class="slds-text-color_weak">
                  No leads found.
                </p>
              </template>
            </div>
          </template>

          <!-- Onboarding in progress -->
          <template if:true={onboardingConfirmed}>
            <div class="slds-align_absolute-center slds-p-around_xx-large">
              <div class="slds-text-align_center">

                <lightning-icon icon-name="utility:info" alternative-text="Information" variant="brand" size="medium"
                  class="slds-m-bottom_medium">
                </lightning-icon>

                <h2 class="slds-text-heading_medium slds-m-bottom_small">
                  Account onboarding in progress.
                </h2>

                <p class="slds-text-body_regular">
                  Check back again later.
                </p>

              </div>
            </div>
          </template>

        </div>

        <footer class="slds-modal__footer">

          <template if:false={onboardingConfirmed}>
            <lightning-button label="Cancel" onclick={handleCancel}>
            </lightning-button>

            <lightning-button class="slds-m-left_small" variant="brand" label="Confirm" onclick={handleConfirm}>
            </lightning-button>
          </template>

          <template if:true={onboardingConfirmed}>
            <lightning-button variant="brand" label="Close" onclick={handleCancel}>
            </lightning-button>
          </template>

        </footer>

      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
